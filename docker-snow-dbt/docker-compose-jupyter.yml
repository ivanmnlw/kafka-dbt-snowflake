services:
 dbt-snow-jupyter:
  container_name: ${JUPYTER_CONTAINER_NAME}
  hostname: ${JUPYTER_CONTAINER_NAME}
  image: dbt-snow/jupyter
  environment:
   - JUPYTER_ALLOW_INSECURE_WRITES=true
  ports:
   - ${JUPYTER_PORT}:8888
   - 4040:4040
   - 4041:4041
  volumes:
   - ../:/resources
   - ../notebooks:/home/jovyan/

networks:
 default:
  name: dbt-snow-network
  external: true
